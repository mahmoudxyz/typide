name: CI

# Fast checks on the pure-Rust crates and the frontend. The Tauri shell
# (app/src-tauri) needs the platform WebView libs and is covered by the release
# build, so it is intentionally not compiled here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Network-isolation check
        run: cargo run -p xtask -- check-deps
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace

  frontend:
    name: Frontend (Svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm --prefix app/ui ci
      - name: Type-check
        run: npm --prefix app/ui run check
      - name: Build
        run: npm --prefix app/ui run build
