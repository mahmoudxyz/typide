name: Release

# Builds native installers for macOS, Windows and Linux and attaches them to a
# GitHub Release. Trigger by pushing a version tag (e.g. `v0.1.0`), or run it
# manually from the Actions tab (workflow_dispatch) for a dry run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon + Intel in one universal .dmg
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # .deb / .rpm / .AppImage — 22.04 keeps glibc broadly compatible
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          # .msi (WiX) + .exe (NSIS)
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libssl-dev \
            libayatana-appindicator3-dev patchelf build-essential curl wget file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Install Rust (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92"
          targets: ${{ matrix.rust-targets }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        run: npm --prefix app/ui ci

      - name: Build app and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Typide ${{ github.ref_name }}"
          releaseBody: |
            Native installers for Typide — a free, offline-first IDE for Typst.

            Download the file for your platform below:

            - **Windows** — `.msi` or the `-setup.exe` (NSIS) installer
            - **macOS** — the universal `.dmg` (Apple Silicon + Intel)
            - **Linux** — `.AppImage` (portable), `.deb` (Debian/Ubuntu) or `.rpm` (Fedora)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
