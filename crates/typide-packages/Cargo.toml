[package]
name = "typide-packages"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Package resolution, cache, lockfile, vendoring, mirrors."

[dependencies]
typide-net = { path = "../typide-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
dirs = "5"
