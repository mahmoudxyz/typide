[package]
name = "typide-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Typide desktop app (Tauri v2 shell)."
publish = false

# NOTE: excluded from the workspace (see /Cargo.toml) because Tauri needs the
# platform WebView libs. Build with `cargo tauri dev/build`.

[lib]
name = "typide_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "typide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

typide-core = { path = "../../crates/typide-core" }
typide-jobs = { path = "../../crates/typide-jobs" }
typide-world = { path = "../../crates/typide-world" }
typide-packages = { path = "../../crates/typide-packages" }
typide-check = { path = "../../crates/typide-check" }
typide-toolchain = { path = "../../crates/typide-toolchain" }
typide-policy = { path = "../../crates/typide-policy" }
typide-vcs = { path = "../../crates/typide-vcs" }
typide-refs = { path = "../../crates/typide-refs" }
